# 用合成資料快速跑通整條 pipeline（CI 與本機驗證用）
inherit: base.yaml

data:
  train_path: data/synthetic_train.csv

cv:
  n_folds: 3
  embargo_days: 2

lgb:
  num_leaves: 31
  min_child_samples: 50
  num_boost_round: 300
  early_stopping_rounds: 30

nn:
  hidden: [64, 32]
  epochs: 5
  batch_size: 2048

output_dir: reports/smoke
